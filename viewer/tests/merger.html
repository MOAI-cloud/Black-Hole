<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Binary merger scenario harness</title>
<link rel="stylesheet" href="../src/styles.css">
<style>
  body { margin: 0; background: #0d0f10; color: #f0f0ed; }
  .harness { display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: minmax(0, 1fr) 230px; height: 100vh; }
  .stage { position: relative; overflow: hidden; }
  canvas#view { width: 100%; height: 100%; display: block; }
  #readouts { position: absolute; left: 24px; bottom: 18px; }
  #controls { grid-row: 1 / span 2; grid-column: 2; overflow: auto; padding: 0 18px; background: #161819; border-left: 1px solid #323435; }
  #plots { position: relative; border-top: 1px solid #323435; background: #121415; padding: 6px 0; }
  #status { position: absolute; top: 12px; left: 16px; font: 11px monospace; color: #93c9a9; }
</style>
<div class="harness">
  <div class="stage"><canvas id="view" tabindex="0"></canvas><div id="readouts"></div><div id="status">starting…</div></div>
  <div id="controls"></div>
  <div id="plots"></div>
</div>
<script type="module">
import { BlackHoleScene } from '../src/BlackHoleScene';
import { DEFAULT_SETTINGS } from '../src/types';
import { loadSkyTexture } from '../src/skies';
import { createMergerScenario } from '../src/scenarios/merger/index';

const status = document.getElementById('status');
const params = new URLSearchParams(location.search);
const settings = { ...DEFAULT_SETTINGS, cinematic: params.has('cinematic'), skyBright: 0.5 };
let fps = 0;
const scene = new BlackHoleScene(document.getElementById('view'), settings, () => {}, stats => { fps = stats.fps; });
scene.setStarTexture(await loadSkyTexture(params.get('sky') ?? 'milky-way'));
const context = {
  renderer: scene.getRenderer(), packedRadiance: scene.packedRadiance,
  kerr: undefined,
  controls: document.getElementById('controls'), plots: document.getElementById('plots'), readouts: document.getElementById('readouts'),
  getTime: () => scene.getObserverTime(), setTime: t => scene.setObserverTime(t),
  setPaused: p => scene.setPaused(p), isPaused: () => scene.isPaused(), requestRedraw: () => scene.requestRedraw()
};
const started = performance.now();
const scenario = await createMergerScenario(context);
const camera = { ...scenario.camera };
if (params.has('theta')) camera.camTheta = Number(params.get('theta'));
if (params.has('r')) camera.camR = Number(params.get('r'));
scene.setSettings({ ...settings, ...camera }, { syncCamera: true });
scene.setProgram(scenario.program);
scene.setFrameListener(t => scenario.frame(t));
scene.setPlaybackRate(Number(params.get('rate') ?? scenario.playbackRate));
if (params.has('time')) { scene.setPaused(true); scene.setObserverTime(Number(params.get('time'))); }
else scene.setPaused(false);
window.harness = { scene, scenario, context };
setInterval(() => { status.textContent = `${scenario.title} · setup ${(performance.now() - started).toFixed(0)} ms · ${fps.toFixed(0)} FPS · t ${scene.getObserverTime().toFixed(0)} M`; }, 500);
</script>
</html>
